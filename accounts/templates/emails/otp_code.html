{% comment %}
One-time-code email, used by both signup verification and password reset.

Table-based with inline styles on purpose. Outlook on Windows renders through Word, which
ignores <style> blocks, flexbox, grid, and margin on most elements — so the layout is nested
tables with cellpadding, and every rule that matters is on the element itself.

Every comment in this file is a comment *block* tag, never the hash form. Django's hash
comment is single-line only: put a newline between its delimiters and it stops being a
comment, and the whole block is emitted as literal text into the message body. Three of them
used to sit in this template, and Gmail rendered them as visible paragraphs of prose above
the code. There is no error and no warning — the template renders "successfully" and the
defect is visible only in an inbox, after the mail has gone out.
HtmlEmailTests.test_no_raw_template_syntax_reaches_the_reader is the guard.

Deliberately no images, no web fonts, no tracking pixel. A transactional code email that
fetches remote content shows "images not displayed" warnings in Gmail and Outlook, adds
spam-filter weight, and delays the one thing the reader wants, which is six digits. The brand
mark is therefore *drawn* from table cells with background colours rather than referenced as
an asset — it costs no request, cannot be blocked, and survives Word.
{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#F1F5F9" style="background-color:#F1F5F9;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:32px 12px;">

      {% comment %}
      Preheader: the grey preview line next to the subject in every inbox list. Left unset,
      clients scrape the first visible text, which here would be the brand name repeated.
      Hidden in the body itself by the zero dimensions.
      {% endcomment %}
      <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F1F5F9;">
        {{ preheader }}
      </div>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:100%;background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;">

        {% comment %}
        Header band. Dark slate, matching the app's own chrome, so the blue mark and the
        blue code box read as the same accent rather than two unrelated blues.
        {% endcomment %}
        <tr>
          <td bgcolor="#0F172A" style="background-color:#0F172A;padding:24px 32px;border-radius:14px 14px 0 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                {% comment %}
                The mark: a stack of three descending bars in a rounded blue tile — the
                inventory-stack motif the app's favicon uses. Each bar is one <td> carrying
                both a bgcolor attribute and a height attribute alongside the inline style,
                because those attributes are the single most reliably honoured construct in
                Word's renderer. font-size/line-height zero stops the &nbsp; from forcing the
                cell taller than its declared height.
                {% endcomment %}
                <td valign="middle" width="46" style="width:46px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="46" height="46" bgcolor="#2563EB" style="width:46px;height:46px;background-color:#2563EB;border-radius:12px;">
                    <tr>
                      <td align="center" valign="middle" style="padding:0 11px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="24" style="width:24px;">
                          <tr><td height="5" bgcolor="#FFFFFF" style="height:5px;background-color:#FFFFFF;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td></tr>
                          <tr><td height="3" style="height:3px;font-size:0;line-height:0;">&nbsp;</td></tr>
                          <tr><td height="5" bgcolor="#BFDBFE" style="height:5px;background-color:#BFDBFE;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td></tr>
                          <tr><td height="3" style="height:3px;font-size:0;line-height:0;">&nbsp;</td></tr>
                          <tr><td height="5" bgcolor="#7FA9F5" style="height:5px;background-color:#7FA9F5;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td></tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                </td>
                <td width="14" style="width:14px;font-size:0;line-height:0;">&nbsp;</td>
                <td valign="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                  <div style="font-size:21px;font-weight:700;color:#FFFFFF;letter-spacing:2px;line-height:24px;">IMS</div>
                  <div style="font-size:12px;color:#94A3B8;line-height:16px;padding-top:3px;">Inventory &amp; Order Management</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:30px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 12px 0;font-size:20px;line-height:27px;font-weight:700;color:#0F172A;">
              {{ heading }}
            </h1>
            <p style="margin:0 0 24px 0;font-size:15px;line-height:23px;color:#475569;">
              {{ intro }}
            </p>
          </td>
        </tr>

        {% comment %}
        The code, on the primary accent. Its own table rather than a styled <div>, because
        Word drops background-color and padding on divs and the code would sit unboxed on
        white — which is the one element in the message that must not be missable.
        {% endcomment %}
        <tr>
          <td style="padding:0 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#2563EB" style="width:100%;background-color:#2563EB;border-radius:10px;">
              <tr>
                <td align="center" style="padding:24px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                  <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:#BFDBFE;text-transform:uppercase;padding-bottom:10px;">
                    {{ code_label }}
                  </div>
                  {% comment %}
                  letter-spacing adds a trailing gap after the last glyph, which reads as
                  off-centre. The matching negative margin-right pulls it back.
                  {% endcomment %}
                  <div style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:36px;line-height:42px;font-weight:700;color:#FFFFFF;letter-spacing:9px;margin-right:-9px;">
                    {{ code }}
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:16px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:13px;line-height:20px;color:#64748B;">
              Valid for {{ ttl_minutes }} minute{{ ttl_minutes|pluralize }}. It can be used once.
            </p>
          </td>
        </tr>

        <tr>
          <td style="padding:24px 32px 4px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr><td height="1" bgcolor="#E2E8F0" style="height:1px;background-color:#E2E8F0;font-size:0;line-height:0;">&nbsp;</td></tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:12px 32px 28px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:13px;line-height:20px;color:#64748B;">
              {{ reassurance }}
            </p>
          </td>
        </tr>

      </table>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:100%;">
        <tr>
          <td align="center" style="padding:18px 32px 8px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:12px;line-height:18px;color:#94A3B8;">
              This is an automated message from {% if business_name %}{{ business_name }}&rsquo;s {% endif %}IMS{% if not business_name %} Inventory &amp; Order Management{% endif %}.<br>
              Please do not reply — this address is not monitored.
            </p>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
