<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="IMS">
  <!--
    IMS brand mark: three descending bars in a rounded tile — an inventory stack seen
    edge-on. Deliberately geometric and flat rather than pictorial: it has to stay legible
    at 16px in a browser tab, where a crate drawn in perspective turns to mush.

    The same motif is drawn from table cells in accounts/templates/emails/otp_code.html,
    so the tab icon and the mark at the top of a verification email are the one logo. If
    this changes, change that too — the bar colours are the shared part.
  -->
  <defs>
    <linearGradient id="ims-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#ims-tile)"/>

  <!--
    Bars are inset 7px each side and lighten as they descend, which reads as depth without
    any shadow. Widths shorten down the stack so the silhouette is a stack and not a
    hamburger menu — the failure mode when all three are equal.
  -->
  <rect x="7" y="9"  width="18" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="7" y="15" width="14" height="4" rx="2" fill="#BFDBFE"/>
  <rect x="7" y="21" width="10" height="4" rx="2" fill="#7FA9F5"/>
</svg>
