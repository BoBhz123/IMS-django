<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The filename carries the version deliberately. Chrome keeps favicons in a cache of
         its own, separate from the HTTP cache and unmoved by a hard reload, so a changed
         icon at an unchanged URL keeps showing the old drawing until the profile evicts it.
         A new path cannot hit the old entry. Bump to -v3 if the mark changes again. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <!-- iOS ignores rel="icon" entirely. Without this, "Add to Home Screen" — which the
         apple-mobile-web-app-capable tag below actively invites — saves a screenshot of the
         page as the icon. 180x180 is the size iOS asks for; it downsamples for every other. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>IMS · Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
